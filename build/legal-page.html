<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Huntz</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:title" content="{{TITLE}} · Huntz">
<meta property="og:description" content="{{DESC}}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{SITE}}/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
{{ICONS}}
{{BREADCRUMB_LD}}
<link rel="stylesheet" href="{{FONTS_HREF}}">
<style>
html{ overflow-x:hidden; overflow-x:clip; overscroll-behavior-x:none }
body{ margin:0; background:#F1EBE0; color:#16130E; overflow-x:hidden; overflow-x:clip;
      font-family:'Figtree',Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased }
/* The fixed gradient is a pseudo-element, not background-attachment: iOS
   re-rasterises a fixed background on every momentum-scroll frame. */
body::before{ content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background-image:radial-gradient(120% 85% at 50% -10%,#FBF8F2 0%,#F3EEE5 42%,#EBE4D7 100%) }
a{ color:#16130E } a:hover{ color:#C24E1F }
::selection{ background:#C24E1F; color:#F3EFE7 }
a:focus-visible,button:focus-visible{ outline:2px solid #C24E1F; outline-offset:3px }
@media (max-width:640px){
  [data-toc]{ columns:1 !important }
  /* Stack the retention table rather than clipping a policy mid-sentence. */
  [data-retention]{ overflow-x:visible !important }
  [data-retention] table{ min-width:0 !important }
  [data-retention] thead{ display:none }
  [data-retention] tr{ display:block; padding:14px 0; border-top:1px solid rgba(22,19,14,.14) }
  [data-retention] th,[data-retention] td{ display:block; width:auto !important; border:0 !important; padding:0 !important }
  [data-retention] th{ margin-bottom:5px }
}
[data-toc-item]:hover span:last-child{ color:#C24E1F }
@media print{
  header,#top-btn,[data-legal-other]{ display:none !important }
  body::before{ display:none }
  body{ background:#fff }
}
@media (prefers-reduced-motion:reduce){ html{ scroll-behavior:auto } }
</style>
</head>
<body>

<header style="position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px clamp(20px,4vw,44px);background:rgba(243,239,231,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(22,19,14,.12)">
  <a href="/" style="font:800 20px 'Figtree',Arial,Helvetica,sans-serif;letter-spacing:-.02em;text-decoration:none;color:#16130E">HUNTZ<span style="color:#C24E1F">.</span></a>
  <a href="/" style="font:600 11px 'Figtree',Arial,Helvetica,sans-serif;letter-spacing:.14em;color:#6E6759;text-decoration:none;white-space:nowrap">&#8592; BACK TO HUNTZ</a>
</header>

<main style="position:relative;max-width:820px;margin:0 auto;padding:clamp(36px,6vh,64px) clamp(20px,5vw,44px) 120px">
{{BODY}}
  <div style="display:flex;flex-wrap:wrap;gap:10px 22px;align-items:baseline;margin-top:16px;padding-top:24px;border-top:1px solid rgba(22,19,14,.14)">
    <span style="font:500 11px 'Figtree',Arial,Helvetica,sans-serif;letter-spacing:.12em;color:#6E6759">QUESTIONS?</span>
    <a href="mailto:team@huntz.ai" style="font:600 11px 'Figtree',Arial,Helvetica,sans-serif;letter-spacing:.12em;color:#16130E;text-decoration:none;border-bottom:1px solid rgba(194,78,31,.5);padding-bottom:2px">TEAM@HUNTZ.AI &#8594;</a>
    <a href="{{OTHER_HREF}}" data-legal-other style="margin-left:auto;font:600 11px 'Figtree',Arial,Helvetica,sans-serif;letter-spacing:.12em;color:#6E6759;text-decoration:none">{{OTHER_LABEL}}</a>
  </div>
</main>

<button type="button" id="top-btn" aria-label="Back to top" style="display:none;position:fixed;right:clamp(16px,3vw,30px);bottom:clamp(16px,3vw,30px);z-index:4;width:44px;height:44px;border-radius:50%;border:1px solid rgba(22,19,14,.2);background:rgba(243,239,231,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#16130E;font:400 16px 'Figtree',Arial,Helvetica,sans-serif;cursor:pointer;box-shadow:0 10px 24px -14px rgba(22,19,14,.6)">&#8593;</button>

<script>
// Contents entries scroll rather than navigate, so the address bar keeps the
// document's own clean URL instead of collecting a section fragment.
document.addEventListener('click', function (e) {
  var b = e.target && e.target.closest && e.target.closest('[data-goto]');
  if (!b) return;
  e.preventDefault();
  var el = document.getElementById(b.getAttribute('data-goto'));
  if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
});
var topBtn = document.getElementById('top-btn');
addEventListener('scroll', function () {
  topBtn.style.display = scrollY > 700 ? 'block' : 'none';
}, { passive: true });
topBtn.addEventListener('click', function () { scrollTo({ top: 0, behavior: 'smooth' }); });
</script>
</body>
</html>
