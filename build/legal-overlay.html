<div id="hz-legal" style="display:none;position:fixed;inset:0;z-index:200;background:#F1EBE0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain">
  <div aria-hidden="true" style="position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(120% 85% at 50% -10%,#FBF8F2 0%,#F3EEE5 42%,#EBE4D7 100%)"></div>

  <div style="position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px clamp(20px,4vw,44px);background:rgba(243,239,231,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(22,19,14,.12)">
    <a href="#" data-legal-back="" style="font:800 20px 'Figtree',Arial,Helvetica,sans-serif;letter-spacing:-.02em;text-decoration:none;color:#16130E">HUNTZ<span style="color:#C24E1F">.</span></a>
    <a href="#" data-legal-back="" style="font:600 11px 'Figtree',Arial,Helvetica,sans-serif;letter-spacing:.14em;color:#6E6759;text-decoration:none;white-space:nowrap">&#8592; BACK TO HUNTZ</a>
  </div>

  <div style="position:relative;z-index:1;max-width:820px;margin:0 auto;padding:clamp(36px,6vh,64px) clamp(20px,5vw,44px) 120px">
    <div id="hz-legal-body"></div>

    <div style="display:flex;flex-wrap:wrap;gap:10px 22px;align-items:baseline;margin-top:16px;padding-top:24px;border-top:1px solid rgba(22,19,14,.14)">
      <span style="font:500 11px 'Figtree',Arial,Helvetica,sans-serif;letter-spacing:.12em;color:#6E6759">QUESTIONS?</span>
      <a href="mailto:team@huntz.ai" style="font:600 11px 'Figtree',Arial,Helvetica,sans-serif;letter-spacing:.12em;color:#16130E;text-decoration:none;border-bottom:1px solid rgba(194,78,31,.5);padding-bottom:2px">TEAM@HUNTZ.AI &#8594;</a>
      <a href="#" data-legal-other="" style="margin-left:auto;font:600 11px 'Figtree',Arial,Helvetica,sans-serif;letter-spacing:.12em;color:#6E6759;text-decoration:none"></a>
    </div>
  </div>

  <button type="button" id="hz-legal-top" aria-label="Back to top" style="display:none;position:fixed;right:clamp(16px,3vw,30px);bottom:clamp(16px,3vw,30px);z-index:4;width:44px;height:44px;border-radius:50%;border:1px solid rgba(22,19,14,.2);background:rgba(243,239,231,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#16130E;font:400 16px 'Figtree',Arial,Helvetica,sans-serif;cursor:pointer;box-shadow:0 10px 24px -14px rgba(22,19,14,.6)">&#8593;</button>
</div>

<style>
/* Two columns of section titles are unreadable on a phone. */
@media (max-width:640px){ [data-toc]{ columns:1 !important } }
[data-toc-item]:hover span:last-child{ color:#C24E1F }
[data-toc-item]:focus-visible{ outline:2px solid #C24E1F; outline-offset:2px }
#hz-legal a:hover{ color:#C24E1F }
</style>

<template id="hz-terms-doc">{{TERMS}}</template>
<template id="hz-privacy-doc">{{PRIVACY}}</template>

<script>
(function () {
  // Legal documents are hash-routed full pages (#/terms, #/privacy) so the back
  // button works and either document can be linked to directly.
  var view = document.getElementById('hz-legal');
  var body = document.getElementById('hz-legal-body');
  var topBtn = document.getElementById('hz-legal-top');
  var docs = {
    '#/terms':   { title: 'Terms of Service', tpl: 'hz-terms-doc',   other: '#/privacy', otherLabel: 'PRIVACY POLICY →' },
    '#/privacy': { title: 'Privacy Policy',   tpl: 'hz-privacy-doc', other: '#/terms',   otherLabel: 'TERMS OF SERVICE →' }
  };
  var homeTitle = document.title;
  var pageOverflow = '';
  var isOpen = false;

  function sync() {
    var doc = docs[location.hash];
    if (doc) {
      body.innerHTML = document.getElementById(doc.tpl).innerHTML;
      var other = view.querySelector('[data-legal-other]');
      other.textContent = doc.otherLabel;
      other.setAttribute('href', doc.other);
      view.style.display = 'block';
      view.scrollTop = 0;
      if (!isOpen) pageOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      document.title = doc.title + ' · Huntz';
      isOpen = true;
    } else if (isOpen) {
      view.style.display = 'none';
      document.body.style.overflow = pageOverflow;
      document.title = homeTitle;
      isOpen = false;
    }
    if (topBtn) topBtn.style.display = 'none';
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;

    // Contents links scroll within the document. They deliberately do not touch
    // location.hash, which the router owns.
    var goto = t.closest('[data-goto]');
    if (goto) {
      e.preventDefault();
      var target = document.getElementById(goto.getAttribute('data-goto'));
      if (target) target.scrollIntoView({ block: 'start' });
      return;
    }
    if (t.closest('[data-legal-back]')) {
      e.preventDefault();
      if (history.length > 1) history.back(); else location.hash = '';
      return;
    }
  });

  view.addEventListener('scroll', function () {
    if (topBtn) topBtn.style.display = view.scrollTop > 700 ? 'block' : 'none';
  }, { passive: true });

  if (topBtn) topBtn.addEventListener('click', function () { view.scrollTop = 0; });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && isOpen) { if (history.length > 1) history.back(); else location.hash = ''; }
  });

  window.addEventListener('hashchange', sync);
  sync(); // support a direct link such as huntz.ai/#/privacy
})();
</script>
