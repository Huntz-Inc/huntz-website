<script>
(function () {
  // Hash-routed legal pages: #/terms and #/privacy take over the viewport as
  // their own page. Browser back/forward works; a direct link to
  // site#/privacy opens the document immediately.
  var view = document.getElementById('hz-legal');
  var titleEl = document.getElementById('hz-legal-title');
  var bodyEl = document.getElementById('hz-legal-body');
  var docs = {
    '#/terms':   { title: 'Terms of Service', tpl: 'hz-terms-doc' },
    '#/privacy': { title: 'Privacy Policy',   tpl: 'hz-privacy-doc' }
  };
  var homeTitle = document.title;
  var openedFromHome = false;
  var isOpen = false;

  function sync() {
    var doc = docs[location.hash];
    if (doc) {
      titleEl.textContent = doc.title;
      bodyEl.innerHTML = document.getElementById(doc.tpl).innerHTML;
      view.style.display = 'block';
      view.scrollTop = 0;
      if (!isOpen) document.body.setAttribute('data-legal-lock', document.body.style.overflow || '');
      document.body.style.overflow = 'hidden';
      document.title = doc.title + ' — Huntz';
      isOpen = true;
    } else if (isOpen) {
      view.style.display = 'none';
      document.body.style.overflow = document.body.getAttribute('data-legal-lock') || '';
      document.body.removeAttribute('data-legal-lock');
      document.title = homeTitle;
      isOpen = false;
    }
  }

  document.addEventListener('click', function (e) {
    var back = e.target && e.target.closest && e.target.closest('[data-legal-back]');
    if (back) {
      e.preventDefault();
      if (openedFromHome) history.back();
      else location.hash = '';
      return;
    }
    var a = e.target && e.target.closest && e.target.closest('a[href="#/terms"], a[href="#/privacy"]');
    if (a) openedFromHome = true; // default hash navigation proceeds; sync() runs on hashchange
  });

  window.addEventListener('hashchange', sync);
  sync(); // handle a direct link like site#/privacy
})();
</script>
